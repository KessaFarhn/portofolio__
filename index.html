<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="shortcut icon" href="images/gift.png" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">

  <!-- Document Title -->
  <title>I Have Something For You</title>

  <!-- Styling Profesional & Estetik (Konsisten dengan Laptop & Sempurna di HP Potrait/Landscape) -->
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: clamp(3vh, 5vh, 8vh) 4vw clamp(4vh, 8vh, 12vh) 4vw;
    }

    /* Penyesuaian Judul Agar Estetik & Tidak Tertutup */
    .title {
      position: relative !important;
      width: 100%;
      text-align: center;
      top: auto !important;
      left: auto !important;
      margin-top: clamp(1vh, 2vh, 4vh);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(22px, 5.5vw, 55px);
      text-shadow: 0px 0px 20px white;
      word-break: break-word;
      overflow-wrap: break-word;
      z-index: 100;
      line-height: 1.3;
    }

    /* Penyesuaian Tombol Terdistribusi Sempurna */
    .btn-container {
      position: relative !important;
      top: auto !important;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: clamp(2vh, 4vh, 6vh);
      z-index: 100;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2.5vh, 18px) clamp(30px, 6vw, 50px);
      background-color: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(15px, 4vw, 20px);
      text-decoration: none;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover, .btn:active {
      background-color: rgba(255, 255, 255, 0.35);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.4);
      transform: scale(1.06);
    }

    .btn .sparkle {
      margin-right: 12px;
      fill: #ffffff;
      width: clamp(18px, 4vw, 24px);
      height: clamp(18px, 4vw, 24px);
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8));
    }

    .btn .text {
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Optimalisasi Orientasi Landscape HP */
    @media (orientation: landscape) and (max-height: 600px) {
      body {
        padding: 3vh 3vw;
      }
      .title {
        font-size: clamp(18px, 4vh, 30px);
        margin-top: 0.5vh;
      }
      .btn-container {
        margin-bottom: 1vh;
      }
    }
  </style>
</head>

<body>
  <!-- Background Night Effect -->
  <div class="night"></div>

  <!-- Title -->
  <h1 class="title"></h1>

  <!-- Interactive Button -->
  <div class="btn-container">
    <a href="flower.html" class="btn">
      <svg height="24" width="24" fill="#FFFFFF" viewBox="0 0 24 24" data-name="Layer 1" id="Layer_1" class="sparkle">
        <path
          d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245ZM18,21l1.5,3L21,21l3-1.5L21,18l-1.5-3L18,18l-3,1.5ZM19.333,4.667,20.5,7l1.167-2.333L24,3.5,21.667,2.333,20.5,0,19.333,2.333,17,3.5Z">
        </path>
      </svg>
      <span class="text">Open</span>
    </a>
  </div>

  <!-- Script initialization -->
  <script src="js/index.js"></script>
</body>

</html>
